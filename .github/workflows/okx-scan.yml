name: OKX Pattern Scan

# 15분마다 자동 실행 + Actions 탭에서 수동 실행("Run workflow") 버튼도 사용 가능.
# GitHub Actions는 5분 미만 간격은 지원하지 않고, 서버가 바쁠 때는 예약 시각보다
# 살짝 늦게 실행될 수 있습니다(공식적으로 지연 가능하다고 안내됨) — 정상입니다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# 이 저장소에 커밋을 푸시하려면 write 권한이 필요합니다.
permissions:
  contents: write

# 이전 실행이 아직 커밋/푸시 중일 때 다음 스케줄 실행이 겹치지 않도록 방지dd
# (겹치면 git push 충돌이 날 수 있어서, 겹치는 대신 뒤 실행은 대기열에 쌓임)
concurrency:
  group: okx-pattern-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests python-dotenv pykrx beautifulsoup4

      - name: 패턴 스캔 실행 (OKX API 호출 → HTML/JS 생성)
        env:
          # 워치리스트는 여기서 직접 관리합니다 (파이썬 스크립트의 DEFAULT_WATCHLIST와 동일).
          # 종목을 추가/삭제하고 싶으면 이 줄만 수정하면 됩니다.
          WATCHLIST: "ETHUSDT.P,BTCUSDT.P,ONDOUSDT.P,SOLUSDT.P,SNDKUSDT.P,CRCLUSDT.P,SKHYUSDT.P,TSLAUSDT.P,AAPLUSDT.P,SPYUSDT.P,MSTRUSDT.P,GOOGLUSDT.P,SOXLUSDT.P,NVDAUSDT.P,QQQUSDT.P,XAUUSDT.P,MUUSDT.P,AMDUSDT.P,PLTRUSDT.P,EWYUSDT.P,TSMUSDT.P,METAUSDT.P,AVGOUSDT.P,KORUUSDT.P,CLUSDT.P,AMZNUSDT.P"
          # 결과 HTML/JS를 저장소 루트(=GitHub Pages가 서빙하는 위치)에 바로 생성.
          OUTPUT_DIR: ${{ github.workspace }}
          # 로컬 PC용 두 번째 저장 경로(E:\Trader_KIM)는 CI에는 없으므로 비활성화.
          SECOND_OUTPUT_DIR: ""
        run: python scanner/okx_3candle_pattern_multi_tf.py

      # 아래 3개(외국인 순매수/MSTR 공시/ETF 자금흐름)는 원본 데이터 자체가
      # 5분 단위로 안 바뀝니다(KRX 수급은 수십 분 지연, SEC 공시는 하루 몇 건
      # 이하, Farside ETF 자금흐름은 하루 1회 갱신). 워크플로우는 5분마다
      # 돌지만 이 스텝들은 :00, :30 — 즉 30분마다만 실제로 실행되도록
      # 걸러줍니다. 더 자주/덜 자주 돌리고 싶으면 아래 MIN 비교값을 바꾸세요.
      - name: 30분 주기 체크
        id: throttle
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" = "00" ] || [ "$MIN" = "30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 외국인 순매수 / MSTR 공시 / ETF 자금흐름 조회 (30분마다)
        if: steps.throttle.outputs.run == 'true'
        # 셋 중 하나가 실패해도(사이트 구조 변경, 일시적 차단 등) 핵심인
        # 패턴 스캔 결과 커밋까지 막지 않도록 워크플로우 실패로 이어지지
        # 않게 합니다.
        continue-on-error: true
        env:
          # KRX_ID/KRX_PW는 저장소 Settings → Secrets and variables → Actions
          # 에서 등록해야 합니다 (Settings → Secrets and variables → Actions →
          # New repository secret). data.krx.co.kr에 회원가입한 아이디/비밀번호.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          OUTPUT_DIR: ${{ github.workspace }}
          SECOND_OUTPUT_DIR: ""
        # 셋을 한 run 블록 안에서 개별로 || 처리합니다 (기본 셸이 set -e라
        # 그냥 나열만 하면 앞에서 하나 실패 시 뒤 스크립트가 아예 안 돌기
        # 때문). 하나가 실패해도 나머지 둘은 계속 실행됩니다.
        run: |
          python scanner/fetch_foreign_flow.py || echo "[WARN] fetch_foreign_flow.py 실패 (계속 진행)"
          python scanner/mstr_filing_tracker.py || echo "[WARN] mstr_filing_tracker.py 실패 (계속 진행)"
          python scanner/etf_flow_scraper.py || echo "[WARN] etf_flow_scraper.py 실패 (계속 진행)"

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "패턴 스캔 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "변경사항 없음"
          git pull --no-rebase -X ours origin main
          git push origin main

          # 결과 파일만 추가 (로그 CSV, 워치리스트 자동생성 파일 등은 저장소에 남기지 않음)
          git add okx_3candle_pattern.html pattern_summary.js

          # foreign_flow_data.js / mstr_filing_data.js / etf_flow_data.js는
          # 아직 한 번도 생성된 적 없는 최초 실행 시에는 파일이 없을 수 있어,
          # git add가 "pathspec did not match" 로 전체 실패하지 않도록 파일이
          # 실제로 있을 때만 하나씩 add합니다.
          for f in foreign_flow_data.js mstr_filing_data.js etf_flow_data.js; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "변경된 내용 없음 - 커밋 생략"
            exit 0
          fi

          git commit -m "패턴 스캔 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 그 사이 다른 커밋이 먼저 푸시됐을 드문 경우를 대비해 한 번 재시도
          git push || (git pull --rebase && git push)
