<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워치리스트 · Trader_KIM Chart</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0A1120; --surface:#111A2C; --surface2:#16213A; --line:#223050;
  --text:#E4EAF4; --muted:#8B97AD; --gold:#E1B24C; --grp:#4DA3FF;
  --focus:#E1B24C; --event:#F0A43A; --wait:#8B97AD; --avoid:#E5534B;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
.top{position:sticky;top:0;z-index:10;background:rgba(10,17,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{max-width:1800px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:17px;margin:0;white-space:nowrap}
h1 small{font-family:var(--mono);font-size:12px;color:var(--gold);margin-left:6px;font-weight:500}
.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
select,button{font:inherit;font-size:12.5px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer}
button[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:flex;gap:4px}
.nav{max-width:1800px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px}
.nav a{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px;padding:3px 8px}
.nav a:hover{background:var(--surface2)}
main{max-width:1800px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px}
.grp{grid-column:1/-1;margin:10px 0 -4px;font-size:15px;font-weight:700;color:var(--grp);scroll-margin-top:110px}
.grp:first-child{margin-top:0}
.grp span{color:var(--muted);font-size:12px;font-weight:500;margin-left:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;overflow:hidden;scroll-margin-top:110px}
.ph{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph .sym{font-family:var(--mono);font-weight:700;font-size:14px}
.ph .tag{font-size:11.5px;font-weight:600;color:var(--c)}
.ph .note{color:var(--muted);font-size:12.5px;flex:1;min-width:0}
.ph a{font-size:12px;color:var(--muted)}
.chart{height:var(--h,520px);position:relative}
.chart .ph-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.chart iframe{display:block;width:100%;height:100%;border:0;background:#0f0f0f}
.big-bg{position:fixed;inset:0;z-index:80;background:#0f0f0f;display:none;flex-direction:column}
.big-bg.open{display:flex}
.big-h{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#161616;border-bottom:1px solid #2a2a2a;font-size:13px}
.big-h b{font-family:var(--mono)} .big-h span{color:var(--muted);flex:1}
.big-h button{padding:3px 10px}
.big-body{flex:1;min-height:0}
.big-body iframe{display:block;width:100%;height:100%;border:0}
.warn{max-width:1800px;margin:0 auto;padding:0 16px;display:none}
.warn div{background:rgba(229,83,75,.12);border:1px solid rgba(229,83,75,.5);color:#F2B8B4;border-radius:6px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.6}
.warn code{font-family:var(--mono);color:var(--text)}
@media (max-width:900px){ main{--cols:1 !important} }

/* ── 가격 알림 ── */
.ph .px{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph .px.live{color:var(--text)}
.ph .px small{font-size:10.5px;color:var(--muted);margin-left:3px}
.ph .bell{padding:1px 7px;font-size:12px}
.ph .bell.has{border-color:var(--gold);color:var(--gold)}
#alarmBtn.on{background:#2a2410;color:var(--gold);border-color:var(--gold)}
.panel.ring{animation:ring .6s ease-in-out 10}
/* 알림 조건 도달 → '해제' 누를 때까지 굵은 빨간 테두리 유지 */
.panel.hit{border:3px solid #FF3B30;box-shadow:0 0 14px rgba(255,59,48,.45)}
.ph .hitbtn{display:none;padding:1px 8px;font-size:11.5px;font-weight:700;background:#FF3B30;color:#fff;border-color:#FF3B30}
.panel.hit .hitbtn{display:inline-block}
/* ── 15분봉 급락 감지 ── */
.ph .dpx{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph .dpx.neg{color:#F2A3C9} .ph .dpx.hot{color:#FF4FD8;font-weight:700}
.panel.drop{outline:3px solid #FF4FD8;outline-offset:-3px;box-shadow:0 0 14px rgba(255,79,216,.4)}
.ph .dropbtn{display:none;padding:1px 8px;font-size:11.5px;font-weight:700;background:#FF4FD8;color:#1a0716;border-color:#FF4FD8}
.panel.drop .dropbtn{display:inline-block}
.nav a.drop{outline:2px solid #FF4FD8;outline-offset:-1px;color:#FFC2EF}
#dropBtn.on{background:#2a1026;color:#FF4FD8;border-color:#FF4FD8;font-weight:600}
#dropTh{width:62px;font:inherit;font-size:12.5px;font-family:var(--mono);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.toast.dtoast{background:#2a1026;border-color:#FF4FD8} .toast.dtoast b{color:#FF4FD8} .toast.dtoast button{background:#FF4FD8;border-color:#FF4FD8;color:#1a0716}
.nav a.hit{border-color:#FF3B30;border-left-color:#FF3B30;color:#FFB3AE;box-shadow:0 0 0 1px #FF3B30}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--gold)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(500px,100%);max-height:85vh;overflow:auto;padding:14px 16px}
.modal h3{margin:0 0 4px;font-size:15px}
.modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.modal .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.modal input{font:inherit;font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.modal input[type=number]{width:140px;font-family:var(--mono)} .modal input.memo{flex:1;min-width:140px}
.modal .add{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.modal .close{float:right;border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.alist{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.alist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.alist li .p{font-family:var(--mono)} .alist li .m{color:var(--muted);font-size:12px;flex:1;min-width:0}
.alist li.done .p{text-decoration:line-through;color:var(--muted)}
.alist li button{padding:1px 7px;font-size:11.5px}
.toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 28px)}
.toast{background:#2a2410;border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;min-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.45);line-height:1.5}
.toast b{color:var(--gold)} .toast button{float:right;margin-left:10px;background:var(--gold);color:var(--bg);border-color:var(--gold);padding:2px 9px}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <h1>워치리스트 <small id="hsub">32 SYMBOLS · Trader_KIM Chart · 🔔 가격 알림</small></h1>
    <label class="ctl" for="ex">거래소
      <select id="ex">
        <option value="OKX" selected>OKX</option>
        <option value="BINANCE">BINANCE</option>
        <option value="BITGET">BITGET</option>
      </select>
    </label>
    <label class="ctl" for="tf">주기
      <select id="tf">
        <option value="1m">1분</option>
        <option value="5m">5분</option>
        <option value="15m" selected>15분</option>
        <option value="1H">1시간</option>
        <option value="4H">4시간</option>
        <option value="12H">12시간</option>
        <option value="1D">일봉</option>
      </select>
    </label>
    <div class="ctl">열
      <div class="seg" role="group" aria-label="열 개수">
        <button type="button" id="c1" data-cols="1">1</button>
        <button type="button" id="c2" data-cols="2">2</button>
        <button type="button" id="c3" data-cols="3">3</button>
      </div>
    </div>
    <label class="ctl" for="hh">높이
      <select id="hh">
        <option value="400">400</option>
        <option value="520" selected>520</option>
        <option value="680">680</option>
        <option value="820">820</option>
      </select>
    </label>
    <label class="ctl" for="flt">필터
      <select id="flt"></select>
    </label>
    <div class="ctl">
      <button type="button" id="alarmBtn" title="소리·데스크톱 알림 허용 (브라우저 정책상 최초 1회 클릭 필요)">🔇 소리 꺼짐 (클릭)</button>
      <button type="button" id="alertAll" title="설정된 전체 알림 보기">알림 0</button>
    </div>
    <div class="ctl" title="최신 15분봉에서 시가 대비 하락폭이 기준 이상이면 알림 + 분홍 테두리 표시">
      <button type="button" id="dropBtn">📉 급락감지 꺼짐</button>
      <input type="number" id="dropTh" min="0.1" max="20" step="0.1" aria-label="급락 기준 %">%
      <select id="dropBasis" aria-label="하락폭 기준">
        <option value="low">저가 기준 (꼬리 포함)</option>
        <option value="close">현재가 기준</option>
      </select>
      <button type="button" id="dropClear" title="급락 표시 전체 해제">급락 해제 0</button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="종목 바로가기"></nav>
</div>

<div class="big-bg" id="bigBg" role="dialog" aria-modal="true">
  <div class="big-h"><b id="bigTitle"></b><span>Trader_KIM Chart</span><button type="button" id="bigClose" title="닫기 (Esc)">✕ 닫기</button></div>
  <div class="big-body" id="bigBody"></div>
</div>

<main id="grid"></main>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <button type="button" class="close" id="mClose" aria-label="닫기">×</button>
    <h3 id="mTitle">가격 알림</h3>
    <div class="sub" id="mSub"></div>
    <div id="mForm">
      <div class="row">
        <select id="mCond"><option value="above">이상 (≥ 상향 돌파)</option><option value="below">이하 (≤ 하향 이탈)</option></select>
        <input type="number" id="mPrice" step="any" placeholder="목표 가격">
        <button type="button" class="add" id="mAdd">추가</button>
      </div>
      <div class="row"><input class="memo" id="mMemo" placeholder="메모 (선택) — 예: 박스 상단 돌파, 0.786 되돌림"></div>
    </div>
    <ul class="alist" id="mList"></ul>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ── 그룹 (필터 기준) ── */
const GROUPS = [
  ["crypto",  "크립토"],
  ["cmdty",   "원자재"],
  ["usidx",   "미국지수"],
  ["semi",    "AI, 반도체"],
  ["bigtech", "빅테크"],
  ["kridx",   "한국지수"],
  ["kospi",   "코스피"]
];
/* '전체'에서는 숨기고, 필터에서 직접 선택했을 때만 표시하는 그룹 */
const HIDE_IN_ALL = ["kridx","kospi"];
const GNAME = Object.fromEntries(GROUPS);
/* 복합 필터 — 여러 그룹을 한 번에 보기 (필터 목록에서 지정 그룹 바로 뒤에 표시) */
const COMBOS = { kr: { name:"한국지수 & 코스피", groups:["kridx","kospi"], after:"kospi" } };
const inFilter = (f, g) => (f === "all" && !HIDE_IN_ALL.includes(g)) || f === g || (COMBOS[f] && COMBOS[f].groups.includes(g));

/* ── 워치리스트 [심볼, 그룹, 판단, 메모] (9/23 브리핑 판단) ── */
const WATCH = [
  ["ETHUSDT.P","crypto","focus","ETF +$270M · 글램스터담 클라이언트 9/29"],
  ["BTCUSDT.P","crypto","focus","ETF +$999M · 박스 85.7–87.3k, 88k 마감 확인"],
  ["ONDOUSDT.P","crypto","wait","주식→토큰 전환 출시 · BTC 연동"],
  ["SOLUSDT.P","crypto","wait","알트 동반 · BTC 연동"],
  ["CRCLUSDT.P","crypto","wait","$78–103 박스 · 끝단에서만"],
  ["MSTRUSDT.P","crypto","wait","950 BTC 매수 · BTC 박스 이탈 대기"],

  ["SPYUSDT.P","usidx","wait","회담 결과 대기"],
  ["QQQUSDT.P","usidx","wait","나스닥 신고가"],

  ["EWYUSDT.P","kridx","wait","추석 휴장 갭 위험"],
  ["KORUUSDT.P","kridx","avoid","한국 3배 · 휴장 갭 위험 최대"],

  ["SAMSUNGUSDT.P","kospi","wait","삼성전자 · 신규 추가 · KRX 장외엔 선물 자체가격"],
  ["HYUNDAIUSDT.P","kospi","wait","현대차 · 신규 추가 · 판단 미정"],
  ["LGELECTRONICSUSDT.P","kospi","wait","LG전자 · 신규 추가 · 판단 미정"],
  ["NAVERUSDT.P","kospi","wait","네이버 · 신규 추가 · 판단 미정"],

  ["XAUUSDT.P","cmdty","wait","$4,350–4,400 박스"],
  ["CLUSDT.P","cmdty","avoid","이란 헤드라인에 급변"],

  ["NVDAUSDT.P","semi","event","미중 회담 9/24 · PER 17배 최저"],
  ["AMDUSDT.P","semi","event","$613 최고가, 시총 1조 달러 · 추격 금지"],
  ["AVGOUSDT.P","semi","event","회담 결과 연동"],
  ["SOXLUSDT.P","semi","event","반도체 3배 · 메모리·회담 모두 노출"],
  ["SNDKUSDT.P","semi","focus","Rosenblatt $2,400 · 과열, 0.786 되돌림만"],
  ["SKHYUSDT.P","semi","focus","추석 휴장 중 선물만 거래 · 비중 절반"],
  ["MUUSDT.P","semi","focus","9/30 실적 전 선반영 · 발표 전 축소"],
  ["TSMUSDT.P","semi","event","회담 결과 연동"],

  ["TSLAUSDT.P","bigtech","event","Semi 9/24 · 로드스터 10/1 · 윗꼬리 숏 관찰"],
  ["AAPLUSDT.P","bigtech","wait","PER 33배 · 이벤트 없음"],
  ["GOOGLUSDT.P","bigtech","wait","개별 뉴스 없음"],
  ["PLTRUSDT.P","bigtech","wait","실적 11/2 · 이벤트 없음"],
  ["METAUSDT.P","bigtech","wait","Muse AI 급등 후 · 갭 0.5 되돌림 확인"],
  ["AMZNUSDT.P","bigtech","wait","신규 추가 · 판단 미정"],
  ["MSFTUSDT.P","bigtech","wait","신규 추가 · 판단 미정"],
  ["SPCXUSDT.P","bigtech","wait","SpaceX 프리마켓 · 신규 추가 · 판단 미정"]
];
const LABEL = {focus:"집중", event:"이벤트 대기", wait:"관망", avoid:"회피"};
const COLOR = {focus:"var(--focus)", event:"var(--event)", wait:"var(--wait)", avoid:"var(--avoid)"};

const store = {
  get(k,d){ try{ return localStorage.getItem("tv15."+k) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("tv15."+k, v); }catch(e){} }
};
const state = {
  ex: store.get("ex3","OKX"), tf: store.get("tf2","15m"),
  cols: store.get("cols","2"), h: store.get("h","520"), flt: store.get("flt2","all")
};
if (state.flt !== "all" && !GNAME[state.flt] && !COMBOS[state.flt]) state.flt = "all";
if (!["OKX","BINANCE","BITGET"].includes(state.ex)) state.ex = "OKX";
if (!["1m","5m","15m","1H","4H","12H","1D"].includes(state.tf)) state.tf = "15m";
const TV_IV = {"1m":"1","5m":"5","15m":"15","1H":"60","4H":"240","12H":"720","1D":"D"};
/* Trader_KIM Chart는 이 파일 안에 내장 (아래 #chartSrc, base64). 각 칸은 srcdoc iframe으로 띄움 */
let CHART_HTML = null;
function chartHTML(){
  if (CHART_HTML == null){
    const b = atob(document.getElementById("chartSrc").textContent.trim());
    CHART_HTML = new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)));
  }
  return CHART_HTML;
}
const chartDoc = qs => chartHTML().replace("<head>", "<head><script>window.__QS=" + JSON.stringify(qs) + ";<\/script>");

const grid = document.getElementById("grid");
const nav = document.getElementById("nav");
const idOf = s => "c-" + s.replace(/[^A-Z0-9]/gi,"");
const fullSym = s => state.ex ? state.ex + ":" + s : s;
const tvUrl = s => "https://www.tradingview.com/chart/?symbol=" + encodeURIComponent(fullSym(s)) + "&interval=" + TV_IV[state.tf];
/* Trader_KIM Chart 심볼 키: OKX는 'ETH', 그 외 'BINANCE:ETHUSDT' · 'BITGET:ETHUSDT' */
const chartKey = s => { const b = s.replace(/USDT\.P$/, ""); return state.ex === "OKX" ? b : state.ex + ":" + b + "USDT"; };
const chartQS = (s, embed) => (embed ? "embed=1&" : "") + "t=" + encodeURIComponent(chartKey(s)) + "&bar=" + state.tf;

/* 필터 옵션 */
document.getElementById("flt").innerHTML =
  `<option value="all">전체</option>` + GROUPS.map(([g,n]) =>
    `<option value="${g}">${n}</option>` +
    Object.entries(COMBOS).filter(([,c]) => c.after === g).map(([k,c]) => `<option value="${k}">${c.name}</option>`).join("")
  ).join("");

/* 그룹 헤더 + 패널 */
grid.innerHTML = GROUPS.map(([g,gn]) => {
  const items = WATCH.filter(w => w[1] === g);
  return `<h2 class="grp" data-g="${g}" id="g-${g}">${gn}<span>${items.length}</span></h2>` +
    items.map(([s,,k,n]) => `
  <section class="panel" id="${idOf(s)}" data-g="${g}" data-s="${s}" style="--c:${COLOR[k]}">
    <div class="ph">
      <span class="sym">${s}</span><span class="tag">${LABEL[k]}</span>
      <span class="note">${n}</span>
      <span class="px" data-px="${s}" title="알림 기준 실시간 가격">…</span>
      <span class="dpx" data-dpx="${s}" title="최신 15분봉 시가 대비 하락폭"></span>
      <button type="button" class="dropbtn" data-dack="${s}" title="급락 표시 해제">📉 급락 · 해제</button>
      <button type="button" class="hitbtn" data-ack="${s}" title="빨간 테두리 해제 (알림 기록은 목록에 남음)">🚨 도달 · 해제</button>

/* ── Trader_KIM Chart 삽입 ──
   화면 근처에 온 패널만 차례로(0.35초 간격) 불러오고, 멀리 벗어난 패널은 내려서 메모리·연결 수를 줄입니다.
   그린 선·포지션·알람은 Trader_KIM_Chart와 같은 저장소를 쓰므로 큰 차트와 공유됩니다. */
const mountQ = []; let mountT = null;
function linkUpdate(panel){
  panel.querySelector(".tvlink").href = tvUrl(panel.dataset.s);
}
function mount(panel){
  linkUpdate(panel);
  const box = panel.querySelector(".chart");
  const fr = document.createElement("iframe");
  fr.srcdoc = chartDoc(chartQS(panel.dataset.s, true));
  fr.title = panel.dataset.s + " 차트";
  fr.setAttribute("allow", "autoplay");
  box.innerHTML = ""; box.appendChild(fr);
  panel.dataset.loaded = "1";
}
function unmount(panel){
  if (!panel.dataset.loaded) return;
  delete panel.dataset.loaded;
  panel.querySelector(".chart").innerHTML = '<div class="ph-load">스크롤하면 불러옵니다</div>';
}
function queueMount(panel){
  if (panel.dataset.loaded || panel.dataset.queued) return;
  panel.dataset.queued = "1"; mountQ.push(panel);
  if (!mountT) pumpQ();
}
function pumpQ(){
  const p = mountQ.shift();
  if (!p){ mountT = null; return; }
  delete p.dataset.queued;
  if (p.dataset.near === "1" && !p.hidden && !p.dataset.loaded) mount(p);
  mountT = setTimeout(pumpQ, 350);
}
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    e.target.dataset.near = e.isIntersecting && !e.target.hidden ? "1" : "0";
    if (e.target.dataset.near === "1") queueMount(e.target);
  });
}, { rootMargin: "400px 0px" });
const ioFar = new IntersectionObserver(entries => {
  entries.forEach(e => { if (!e.isIntersecting) unmount(e.target); });
}, { rootMargin: "2500px 0px" });
const panels = [...grid.querySelectorAll(".panel")];
panels.forEach(p => { io.observe(p); ioFar.observe(p); });

function reloadAll(){
  panels.forEach(p => {
    linkUpdate(p);
    if (p.dataset.loaded){ const fr = p.querySelector("iframe"); if (fr) fr.srcdoc = chartDoc(chartQS(p.dataset.s, true)); }
  });
}

/* ════════════ 가격 알림 ════════════
   TradingView 위젯은 가격을 페이지에 넘겨주지 않으므로, 선택한 거래소의 공개 시세 API로
   무기한(USDT-M) 가격을 5초마다 직접 조회해 알림을 판단합니다. (거래소 1곳당 1회 요청으로 전 종목 조회)
   선택 거래소에 없는 종목은 다른 거래소 가격으로 대체하며, 가격 옆에 출처를 표시합니다. */
const FEEDS = {
  OKX:     { url:"https://www.okx.com/api/v5/market/tickers?instType=SWAP",
             parse:j => (j.data||[]).filter(t=>/-USDT-SWAP$/.test(t.instId)).map(t => [t.instId.replace("-USDT-SWAP","USDT"), +t.last]) },
  BINANCE: { url:"https://fapi.binance.com/fapi/v1/ticker/price",
             parse:j => (Array.isArray(j)?j:[]).map(t => [t.symbol, +t.price]) },
  BYBIT:   { url:"https://api.bybit.com/v5/market/tickers?category=linear",
             parse:j => ((j.result||{}).list||[]).map(t => [t.symbol, +t.lastPrice]) },
  BITGET:  { url:"https://api.bitget.com/api/v2/mix/market/tickers?productType=USDT-FUTURES",
             parse:j => (j.data||[]).map(t => [t.symbol, +t.lastPr]) },
};
const FEED_ORDER = ["OKX","BINANCE","BYBIT","BITGET"];
const base = s => s.replace(/\.P$/,"");            // ETHUSDT.P → ETHUSDT
const PRICE = {};                                    // 심볼 → {p, src}
const FEEDOK = {};                                   // 거래소 → 마지막 조회 성공 여부
let ALERTS = []; let audioCtx = null, alarmReady = false, curSym = null;

try{ ALERTS = JSON.parse(store.get("alerts","[]")) || []; }catch(e){ ALERTS = []; }
const saveAlerts = () => { store.set("alerts", JSON.stringify(ALERTS)); refreshAlertUI(); };

function fmt(v){
  if(v == null || isNaN(v)) return "-";
  const d = v >= 1000 ? 2 : v >= 1 ? (v >= 100 ? 2 : 3) : 5;
  return Number(v).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
}

async function pullFeed(ex){
  try{
    const r = await fetch(FEEDS[ex].url, {cache:"no-store"});
    if(!r.ok) throw 0;
    const m = new Map(FEEDS[ex].parse(await r.json()).filter(([,p]) => p > 0));
    FEEDOK[ex] = true; return m;
  }catch(e){ FEEDOK[ex] = false; return null; }
}
async function pollPrices(){
  const pref = state.ex || "OKX";
  const order = [pref, ...FEED_ORDER.filter(x => x !== pref)];
  const maps = {};
  // 선택 거래소 먼저, 빠진 종목이 있을 때만 다음 거래소 조회
  for(const ex of order){
    const missing = WATCH.some(([s]) => !Object.values(maps).some(m => m.has(base(s))));
    if(!missing) break;
    const m = await pullFeed(ex); if(m) maps[ex] = m;
  }
  WATCH.forEach(([s]) => {
    const src = order.find(ex => maps[ex] && maps[ex].has(base(s)));
    const el = document.querySelector(`[data-px="${s}"]`);
    if(src){
      PRICE[s] = {p: maps[src].get(base(s)), src};
      if(el){ el.innerHTML = fmt(PRICE[s].p) + (src !== pref ? `<small>${src}</small>` : ""); el.classList.add("live");
              el.title = `알림 기준: ${src} ${base(s)} 무기한` + (src !== pref ? " (선택 거래소에 없어 대체)" : ""); }
    }else if(el){ el.textContent = "시세 없음"; el.classList.remove("live"); el.title = "조회 가능한 거래소 시세 없음 — 알림 불가"; }
  });
  checkAlerts();
  if(curSym) renderSub();
}

function checkAlerts(){
  let hit = false;
  ALERTS.forEach(a => {
    if(a.done || !PRICE[a.sym]) return;
    const p = PRICE[a.sym].p;
    if(a.cond === "above" ? p >= a.price : p <= a.price){
      a.done = true; a.hitPrice = p; a.hitAt = Date.now(); hit = true; fire(a, p);
    }
  });
  if(hit) saveAlerts();
}

/* 알람: 경고음 + 데스크톱 알림 + 토스트 + 패널 깜빡임 + 탭 제목 */
/* ── 소리 ──
   브라우저는 '사용자 클릭 이후'에만 소리를 허용합니다. 페이지 아무 곳이나 한 번 클릭/키 입력하면
   자동으로 소리가 활성화되도록 하고(새로고침 후에도), WebAudio가 막히면 <audio>(WAV) 방식으로 재생합니다. */
let wavEl = null;
function makeWav(){                     // 880/660Hz 번갈아 6회 '삐-삐' 경고음 WAV 생성 (약 2초)
  const sr = 22050, beepLen = 0.28, gap = 0.07, n = 6, len = Math.floor(sr * n * (beepLen + gap));
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4, 36 + len*2, true); w(8,"WAVEfmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,len*2,true);
  for(let i = 0; i < len; i++){
    const t = i / sr, k = Math.floor(t / (beepLen + gap)), tt = t - k * (beepLen + gap);
    const f = k % 2 ? 660 : 880;
    const env = tt < beepLen ? Math.min(1, tt / 0.01, (beepLen - tt) / 0.02) : 0;
    const sq = Math.sin(2 * Math.PI * f * t) >= 0 ? 1 : -1;
    v.setInt16(44 + i*2, sq * env * 0.6 * 32767, true);
  }
  let bin = ""; new Uint8Array(buf).forEach(x => bin += String.fromCharCode(x));
  return "data:audio/wav;base64," + btoa(bin);
}
function ensureAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state !== "running") audioCtx.resume();
  }catch(e){}
  if(!wavEl){ try{ wavEl = new Audio(makeWav()); wavEl.volume = 1; }catch(e){} }
}
function unlockAudio(){                 // 사용자 동작 안에서 호출 → 이후 자동 재생 허용
  ensureAudio();
  if(wavEl){ wavEl.muted = true; wavEl.play().then(() => { wavEl.pause(); wavEl.currentTime = 0; wavEl.muted = false; }).catch(() => { wavEl.muted = false; }); }
  setAlarmBtn();
}
function audioReady(){ return audioCtx && audioCtx.state === "running"; }
function beep(n = 6){
  ensureAudio();
  if(audioReady()){
    const t0 = audioCtx.currentTime + 0.02;
    for(let k = 0; k < n; k++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + k*0.35;
      o.type = "square"; o.frequency.value = k % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.3);
    }
    return true;
  }
  if(wavEl){ try{ wavEl.currentTime = 0; wavEl.play().catch(() => {}); return true; }catch(e){} }
  return false;
}
/* 확인 누를 때까지 4초마다 반복 (최대 60초) */
let ringT = null, ringEnd = 0;
function startRinging(){
  ringEnd = Date.now() + 60000;
  beep();
  clearInterval(ringT);
  ringT = setInterval(() => { if(Date.now() > ringEnd || !document.querySelector(".toast")) return stopRinging(); beep(); }, 4000);
}
function stopRinging(){ clearInterval(ringT); ringT = null; }
function setAlarmBtn(){
  const b = $("alarmBtn"); if(!b) return;
  const ok = audioReady();
  b.textContent = ok ? "🔔 소리 켜짐 · 테스트" : "🔇 소리 꺼짐 (클릭)";
  b.classList.toggle("on", ok);
  b.title = ok ? "클릭하면 테스트 경고음이 울립니다" : "브라우저 정책상 페이지를 한 번 클릭해야 소리가 납니다";
}
// 페이지 어디든 첫 클릭/키 입력 시 자동 활성화 (새로고침 후에도)
["pointerdown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, () => { if(!audioReady()) unlockAudio(); }, {capture:true, passive:true}));
document.addEventListener("visibilitychange", () => { if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(()=>{}); });
const baseTitle = document.title; let titleT = null;
const flashTitle = m => { clearInterval(titleT); let on = false; titleT = setInterval(() => document.title = (on = !on) ? "🔔 " + m : baseTitle, 800); };
const stopFlash = () => { clearInterval(titleT); document.title = baseTitle; };

function fire(a, p){
  const sym = base(a.sym), src = PRICE[a.sym].src;
  const msg = `${sym} ${a.cond === "above" ? "≥" : "≤"} ${fmt(a.price)} 도달 (현재 ${fmt(p)})`;
  startRinging(); flashTitle(sym + " 알림");
  const panel = document.getElementById(idOf(a.sym));
  if(panel && !panel.hidden){ panel.classList.remove("ring"); void panel.offsetWidth; panel.classList.add("ring"); }
  try{ if("Notification" in window && Notification.permission === "granted")
    new Notification("가격 알림 — " + sym, {body: msg + (a.memo ? "\n" + a.memo : ""), tag: a.id, requireInteraction: true});
  }catch(e){}
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<button type="button">확인</button><b>🔔 ${sym}</b><br>${msg}` +
    (a.memo ? `<br><span style="color:var(--muted)">${a.memo}</span>` : "") +
    `<br><span style="font-size:11px;color:var(--muted)">${src} 무기한 · ${new Date().toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul"})}</span>`;
  t.querySelector("button").onclick = () => { t.remove(); if(!document.querySelector(".toast")){ stopFlash(); stopRinging(); } };
  t.style.cursor = "pointer";
  t.addEventListener("click", e => { if(e.target.tagName !== "BUTTON" && panel){ panel.scrollIntoView({behavior:"smooth"}); } });
  $("toasts").appendChild(t);
}

$("alarmBtn").addEventListener("click", async () => {
  unlockAudio();
  try{ if("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); }catch(e){}
  alarmReady = true; store.set("alarmOn","1");
  setTimeout(() => { if(!beep(2)) alert("소리를 재생할 수 없습니다. 브라우저 탭/사이트 소리가 음소거되어 있지 않은지 확인하세요."); setAlarmBtn(); }, 50);
});

function openModal(sym){

function closeModal(){ curSym = null; $("modalBg").classList.remove("open"); }
function renderSub(){
  const warn = audioReady() ? "" : `<br><span style="color:var(--gold)">소리가 꺼져 있습니다 — 상단 '🔇 소리 꺼짐' 버튼(또는 페이지 아무 곳) 클릭 시 켜집니다.</span>`;
  if(curSym === "*"){ $("mSub").innerHTML = `활성 ${ALERTS.filter(a=>!a.done).length}개 · 울린 알림 ${ALERTS.filter(a=>a.done).length}개` + warn; return; }
  const q = PRICE[curSym];
  $("mSub").innerHTML = q ? `알림 기준: <b>${q.src} ${base(curSym)} 무기한</b> · 현재가 <b style="font-family:var(--mono)">${fmt(q.p)}</b>` + warn
                          : `<span style="color:var(--avoid)">이 종목의 실시간 시세를 가져오지 못했습니다 — 알림이 울리지 않습니다.</span>` + warn;
}
function renderList(){

    .sort((x, y) => x.sym.localeCompare(y.sym) || x.price - y.price);
  $("mList").innerHTML = list.length ? list.map(a => `

}
function refreshAlertUI(){
  $("alertAll").textContent = `알림 ${ALERTS.filter(a => !a.done).length}`;
  document.querySelectorAll("[data-bell]").forEach(b => {

}

  if(t.dataset.go){ closeModal(); return; }
  if(t.dataset.del) ALERTS = ALERTS.filter(a => a.id !== t.dataset.del);
  else if(t.dataset.re){ const a = ALERTS.find(a => a.id === t.dataset.re); if(a){ a.done = false; delete a.hitPrice; delete a.hitAt; delete a.ack; } }
  else return;
  saveAlerts();
});
/* 거래소 변경 시 알림 기준 가격도 즉시 갱신 */
$("ex").addEventListener("change", () => pollPrices());

/* ════════════ 15분봉 급락 감지 ════════════
   종목마다 해당 거래소의 최신 15분봉(시가·저가·종가)을 차례로 받아 오고(약 20초 주기),
   그 사이에는 5초 시세로 저가·현재가를 갱신합니다.
   하락폭 = (시가 − 저가 또는 현재가) ÷ 시가. 기준 이상이면 봉마다 1회 알림 + '해제' 누를 때까지 분홍 테두리. */
const DROP = Object.assign({ on:false, th:0.5, basis:"low" }, (() => { try{ return JSON.parse(store.get("drop","{}")) || {}; }catch(e){ return {}; } })());
const DST = {};                                     // 심볼 → {t,o,l,c,src,pct,hit,ack,firedT,hitPct}
const D15 = 900000;
const saveDrop = () => store.set("drop", JSON.stringify({ on:DROP.on, th:DROP.th, basis:DROP.basis }));
const KLINE = {
  OKX:     b => [`https://www.okx.com/api/v5/market/candles?instId=${b.replace(/USDT$/,"")}-USDT-SWAP&bar=15m&limit=1`, j => (j.data||[])[0]],
  BINANCE: b => [`https://fapi.binance.com/fapi/v1/klines?symbol=${b}&interval=15m&limit=1`, j => Array.isArray(j) ? j[j.length-1] : null],
  BYBIT:   b => [`https://api.bybit.com/v5/market/kline?category=linear&symbol=${b}&interval=15&limit=1`, j => ((j.result||{}).list||[])[0]],
  BITGET:  b => [`https://api.bitget.com/api/v2/mix/market/candles?symbol=${b}&productType=USDT-FUTURES&granularity=15m&limit=1`, j => { const d = j.data||[]; return d[d.length-1]; }]
};
async function fetchK(sym){
  const src = (PRICE[sym] && PRICE[sym].src) || state.ex || "OKX";
  const [url, pick] = KLINE[src](base(sym));
  try{
    const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw 0;
    const k = pick(await r.json()); if(!k) throw 0;
    const t = +k[0], o = +k[1], l = +k[3], c = +k[4];
    if(!(o > 0)) throw 0;
    const d = DST[sym] = DST[sym] || {};
    if(d.t !== t){ d.t = t; d.l = l; } else d.l = Math.min(d.l, l);
    d.o = o; d.c = c; d.src = src;
  }catch(e){}
}
function dropLive(){                                 // 5초 시세로 진행 중인 봉 갱신
  const now = Date.now();
  for(const sym in DST){
    const d = DST[sym], q = PRICE[sym];
    if(!q || q.src !== d.src || !(now < d.t + D15)) continue;
    d.c = q.p; d.l = Math.min(d.l, q.p);
  }
}
function dropEval(){
  if(!DROP.on) return;
  const now = Date.now();
  WATCH.forEach(([sym]) => {
    const d = DST[sym], el = document.querySelector(`[data-dpx="${sym}"]`);
    if(!d || !d.o){ if(el) el.textContent = ""; return; }
    const ref = DROP.basis === "close" ? d.c : d.l;
    d.pct = (d.o - ref) / d.o * 100;
    const live = now < d.t + D15;
    if(el){
      const chg = (d.c - d.o) / d.o * 100;
      el.textContent = `15m ${chg >= 0 ? "+" : ""}${chg.toFixed(2)}% · 낙폭 ${d.pct.toFixed(2)}%`;
      el.className = "dpx" + (d.pct >= DROP.th ? " hot" : chg < 0 ? " neg" : "");
      el.title = `${d.src} 최신 15분봉 ${new Date(d.t).toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false})} 시작 · 시가 ${fmt(d.o)} · 저가 ${fmt(d.l)} · 현재 ${fmt(d.c)}` + (live ? "" : " (봉 마감 — 다음 봉 대기)");
    }
    if(live && d.pct >= DROP.th && d.firedT !== d.t){
      d.firedT = d.t; d.hit = true; d.ack = false; d.hitPct = d.pct;
      dropFire(sym, d);
    }
  });
  refreshDropUI();
}
function dropFire(sym, d){
  const nm = base(sym).replace(/USDT$/,"");
  const tm = new Date(d.t).toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false});
  const msg = `${nm} 15분봉(${tm}) 하락 −${d.pct.toFixed(2)}% (시가 ${fmt(d.o)} → ${DROP.basis === "close" ? "현재" : "저가"} ${fmt(DROP.basis === "close" ? d.c : d.l)})`;
  startRinging(); flashTitle(nm + " 15분 급락");
  const panel = document.getElementById(idOf(sym));
  if(panel && !panel.hidden){ panel.classList.remove("ring"); void panel.offsetWidth; panel.classList.add("ring"); }
  try{ if("Notification" in window && Notification.permission === "granted")
    new Notification("📉 15분봉 급락 — " + nm, { body: msg, tag: "drop-" + sym + d.t, requireInteraction: true });
  }catch(e){}
  const t = document.createElement("div"); t.className = "toast dtoast";
  t.innerHTML = `<button type="button">확인</button><b>📉 ${nm} 급락</b><br>${msg}<br><span style="font-size:11px;color:var(--muted)">${d.src} 무기한 · 기준 ${DROP.th}% · ${new Date().toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul"})}</span>`;
  t.querySelector("button").onclick = ev => { ev.stopPropagation(); t.remove(); if(!document.querySelector(".toast")){ stopFlash(); stopRinging(); } };
  t.style.cursor = "pointer";
  t.addEventListener("click", ev => { if(ev.target.tagName !== "BUTTON" && panel) panel.scrollIntoView({behavior:"smooth"}); });
  $("toasts").appendChild(t);
}
function dropAck(sym){ const d = DST[sym]; if(d) d.ack = true; refreshDropUI(); }
function refreshDropUI(){
  const marked = new Set(DROP.on ? Object.keys(DST).filter(k => DST[k].hit && !DST[k].ack) : []);
  document.querySelectorAll(".panel[data-s]").forEach(p => {
    const on = marked.has(p.dataset.s); p.classList.toggle("drop", on);
    const b = p.querySelector(".dropbtn"); if(on && b) b.textContent = `📉 급락 −${DST[p.dataset.s].hitPct.toFixed(2)}% · 해제`;
  });
  nav.querySelectorAll("a[data-s]").forEach(a => a.classList.toggle("drop", marked.has(a.dataset.s)));
  $("dropClear").textContent = `급락 해제 ${marked.size}`;
  $("dropClear").disabled = !marked.size;
  const b = $("dropBtn"); b.classList.toggle("on", DROP.on);
  b.textContent = DROP.on ? "📉 급락감지 켜짐" : "📉 급락감지 꺼짐";
  b.title = DROP.on ? "클릭하면 급락 감지를 끕니다" : "클릭하면 최신 15분봉 급락 감지를 켭니다";
}
let dropT = null, dropRun = false;
async function dropCycle(){
  if(!DROP.on || dropRun) return;
  dropRun = true;
  for(const [sym] of WATCH){ if(!DROP.on) break; await fetchK(sym); await new Promise(r => setTimeout(r, 120)); }
  dropRun = false; dropEval();
}
function dropStart(){ clearInterval(dropT); dropCycle(); dropT = setInterval(dropCycle, 20000); }
function dropStop(){
  clearInterval(dropT); dropT = null;
  document.querySelectorAll("[data-dpx]").forEach(el => { el.textContent = ""; el.className = "dpx"; });
  refreshDropUI();
}
$("dropTh").value = DROP.th; $("dropBasis").value = DROP.basis;
$("dropBtn").addEventListener("click", async () => {
  DROP.on = !DROP.on; saveDrop();
  if(DROP.on){
    unlockAudio();
    try{ if("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); }catch(e){}
    dropStart();
  } else dropStop();
  refreshDropUI();
});
$("dropTh").addEventListener("change", e => {
  const v = parseFloat(e.target.value);
  DROP.th = v > 0 ? Math.min(20, v) : 0.5; e.target.value = DROP.th; saveDrop();
  for(const k in DST) DST[k].firedT = null;          // 기준 바뀌면 현재 봉 다시 판정
  dropEval();
});
$("dropBasis").addEventListener("change", e => { DROP.basis = e.target.value; saveDrop(); for(const k in DST) DST[k].firedT = null; dropEval(); });
$("dropClear").addEventListener("click", () => { for(const k in DST) if(DST[k].hit) DST[k].ack = true; refreshDropUI(); });
/* 5초 시세 조회 뒤 진행 중인 봉 갱신·판정 */
const _pollPrices = pollPrices;
pollPrices = async function(){ await _pollPrices(); if(DROP.on){ dropLive(); dropEval(); } };
refreshDropUI();
if(DROP.on) dropStart();

refreshAlertUI();
pollPrices(); setInterval(pollPrices, 5000);
</script>
